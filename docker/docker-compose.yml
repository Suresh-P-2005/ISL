version: '3.8'

services:
  isl-translator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: isl-translator-app
    ports:
      - "5000:5000"
    environment:
      - FLASK_ENV=production
      - SECRET_KEY=prod-secret-key-change-me
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/status"]
      interval: 30s
      timeout: 5s
      retries: 3
